apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm
  namespace: monitoring
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
      interval: 5m
  releaseName: vm
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    victoria-metrics-operator:
      enabled: false
    vmsingle:
      # we're using cluster, so this is false
      enabled: false
    vmcluster:
      enabled: true
      spec:
        retentionPeriod: "1"
        replicationFactor: 2
        vmstorage:
          replicaCount: 2
          storageDataPath: /vm-data
          extraArgs:
            dedup.minScrapeInterval: 10s
          storage:
            volumeClaimTemplate:
              spec:
                # the PV's need to be pre-created before we apply this
                storageClassName: longhorn-replica-1
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 30Gi
        vmselect:
          port: "8481"
          replicaCount: 2
          cacheMountPath: /select-cache
          extraArgs:
            dedup.minScrapeInterval: 10s
          storage:
            volumeClaimTemplate:
              spec:
                resources:
                  requests:
                    storage: 2Gi
        vminsert:
          port: "8480"
          replicaCount: 2
      ingress:
        enabled: false
        select:
          enabled: false
        insert:
          enabled: false
    alertmanager:
      enabled: true
      spec:
        replicaCount: 1
        port: "9093"
        selectAllByDefault: true
        image:
          tag: v0.31.1
        externalURL: https://alertmanager.castor.baeriswyl.dev
        routePrefix: /
        # otherwise all alerts *must* be in the victoria-metrics-k8s-stack namespace; see https://github.com/VictoriaMetrics/VictoriaMetrics/issues/8285#issuecomment-2653038071
        disableNamespaceMatcher: true
      # required otherwise the auth_password secretRef below doesn't work
      useManagedConfig: true
      config:
        route:
          # this becomes the default
          receiver: discord
          group_by:
            - alertgroup
            - job
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - matchers:
                - severity =~ "info|warning|critical"
              receiver: discord
              continue: false
            - continue: true
              receiver: blackhole
        receivers:
          - name: discord
            discord_configs:
              - webhook_url: ENC[AES256_GCM,data:0lXvnVqNy+2FvJCgLU+Oki19TmhShvwHWxP5BTRDWQDyCW9GvW36C9c303uMep3aoTKdHemmfSJ7MWmuZnXfQLxI9ecNG3ifeEVVXHTtMgqMVA6gc6COYb1xOD0hZzMCdjpyYggd//fBJ1AqFh8hXU5PGdQR+DK2sg==,iv:iPX2b8U1cfJ89jbj/qYniVpDcB+nnBSeJUBqELaa/5c=,tag:TizJfahaz/DsBxDEmTh+dQ==,type:str]
          - name: blackhole
      monzoTemplate:
        enabled: false
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          kubernetes.io/ingress.class: traefik
        ingressClassName: traefik
        path: '{{ .Values.alertmanager.spec.routePrefix | default "/" }}'
        pathType: Prefix
        hosts:
          - alertmanager.castor.baeriswyl.dev
        tls:
          - secretName: alertmanager-ingress-tls
            hosts:
              - alertmanager.castor.baeriswyl.dev
    vmalert:
      enabled: true
      remoteWriteVMAgent: false
      spec:
        port: "8080"
        selectAllByDefault: true
        evaluationInterval: 15s
        extraArgs:
          http.pathPrefix: /
      ingress:
        enabled: false
    vmauth:
      enabled: false
    vmagent:
      enabled: true
      spec:
        scrapeInterval: 10s
        replicaCount: 2
      ingress:
        # enabling ingress on this because it's what allows us to check configured targets, etc.
        enabled: true
        annotations:
          spec.ingressClassName: traefik
          cert-manager.io/cluster-issuer: letsencrypt-prod
        ingressClassName: traefik
        hosts:
          - vmagent.castor.baeriswyl.dev
        tls:
          - secretName: vmagent-ingress-tls
            hosts:
              - vmagent.castor.baeriswyl.dev
    grafana:
      enabled: true
      admin:
        existingSecret: grafana-admin-password
      persistence:
        type: pvc
        enabled: true
        storageClassName: longhorn
        size: 500Mi
      sidecar:
        datasources:
          enabled: true
          initDatasources: false
          label: grafana_datasource
        dashboards:
          provider:
            name: default
            orgid: 1
          folder: /var/lib/grafana/dashboards
          defaultFolderName: default
          enabled: true
          multicluster: false
          searchNamespace: ALL
      forceDeployDatasource: false
      plugins:
        - victoriametrics-logs-datasource
      ingress:
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          kubernetes.io/ingress.class: traefik
        enabled: "true"
        ingressClassName: traefik
        hosts:
          - grafana.castor.baeriswyl.dev
        tls:
          - hosts:
              - grafana.castor.baeriswyl.dev
            secretName: grafana-cert-secret
      vmScrape:
        enabled: true
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/name: '{{ include "grafana.name" .Subcharts.grafana }}'
          endpoints:
            - port: '{{ .Values.grafana.service.portName }}'
    defaultDatasources:
      victoriametrics:
        perReplica: false
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            isDefault: true
          - name: VictoriaMetrics (DS)
            isDefault: false
            type: victoriametrics-metrics-datasource
    prometheus-node-exporter:
      enabled: true
    kube-state-metrics:
      enabled: true
      # see note about this below
      replicas: 1
    kubelet:
      enabled: true
    # Component scraping the kube api server
    kubeApiServer:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                # this is necessary otherwise the scrape will fail with a hostname/tls error
                serverName: kubernetes
          jobLabel: component
          namespaceSelector:
            matchNames:
              - default
          selector:
            matchLabels:
              component: apiserver
              provider: kubernetes
    kubeControllerManager:
      enabled: true
      service:
        enabled: true
      vmScrape:
        spec:
          jobLabel: jobLabel
          namespaceSelector:
            matchNames:
              - kube-system
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              # bearerTokenSecret:
              #   key: ""
              port: http-metrics
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: localhost
                insecureSkipVerify: true
    kubeScheduler:
      enabled: true
      service:
        enabled: true
      vmScrape:
        spec:
          jobLabel: jobLabel
          namespaceSelector:
            matchNames:
              - kube-system
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: 127.0.0.1
                insecureSkipVerify: true
    kubeEtcd:
      enabled: true
      service:
        enabled: true
        port: 2379
        targetPort: 2379
        selector:
          # instead of using hardcoded IP endpoints,
          component: kube-controller-manager
          # this is a trick borrowed from from https://github.com/siderolabs/talos/discussions/7214#discussioncomment-10255876 
          # which only works if/because etcd is deployed on the same nodes where the rest
          # of the api server (notably kube-controller-manager) are deployed. Adjust if that's 
          # not how your cluster is set up.
      # vmScrape here is synonymous with serviceMonitor in kube-prometheus
      vmScrape:
        spec:
          jobLabel: jobLabel
          namespaceSelector:
            matchNames:
              - kube-system
          endpoints:
            - port: http-metrics
              scheme: https
              # caFile, certFile, and keyFile from Neil's post
              tlsConfig:
                ca:
                  # can reference the secret directly instead of needing
                  secret:
                    # to add it somewhere else
                    name: etcd-secrets
                    key: ca.crt
                cert:
                  secret:
                    name: etcd-secrets
                    key: server.crt
                keySecret:
                  name: etcd-secrets
                  key: server.key
    coreDns:
      enabled: true
      service:
        enabled: true
    kubeDns:
      enabled: false
      service:
        enabled: false
    kubeProxy:
      enabled: true
      service:
        enabled: true
    prometheus-operator-crds:
      enabled: false
