apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vmware-tanzu
  namespace: velero
spec:
  interval: 1h0m0s
  url: https://vmware-tanzu.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  chart:
    spec:
      chart: velero
      version: 11.3.2
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
  interval: 1h0m0s
  values:
    snapshotsEnabled: false
    deployNodeAgent: true
    credentials:
      existingSecret: velero-castor-credentials
    configuration:
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: velero-castor
          credential:
            name: velero-castor-credentials
            key: creds
          config:
            s3Url: http://192.168.0.51:3900
            s3ForcePathStyle: true
            region: garage
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.13.1
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins
    # bitnamilegacy is no longer an option as latest kubectl versions are no longer published
    kubectl:
      image:
        repository: public.ecr.aws/bitnami/kubectl
    schedules:
      mainbackup:
        disabled: false
        labels:
          myenv: foo
        annotations:
          myenv: foo
        schedule: "0 0 * * *"
        useOwnerReferencesInBackup: false
        paused: false
        skipImmediately: false
        template:
          ttl: "240h"
          storageLocation: default
          excludeNamespaces:
          - cert-manager
          - headlamp
          - longhorn
          - metallb-system
          - traefik
          excludedNamespaceScopedResources:
          - persistentVolumeClaims
          excludedClusterScopedResources:
          - "*"
---
kind: VolumeSnapshotClass
apiVersion: snapshot.storage.k8s.io/v1
metadata:
  name: longhorn
driver: driver.longhorn.io
deletionPolicy: Delete