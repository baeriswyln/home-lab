apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: zitadel
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: zitadel
      sourceRef:
        kind: HelmRepository
        name: zitadel
      interval: 5m
  releaseName: zitadel
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    replicaCount: 2
    zitadel:
      masterkeySecretName: zitadel-masterkey
      configSecretName: zitadel-db-credentials
      configmapConfig:
        ExternalDomain: auth.castor.baeriswyl.local
        ExternalSecure: true
        ExternalPort: 443
        TLS:
          Enabled: false
        Database:
          Postgres:
            Host: postgres.database.svc.cluster.local
            Port: 5432
            Database: zitadel
            User:
              Username: zitadel
              SSL:
                Mode: verify-full
            Admin:
              Username: postgres
              SSL:
                Mode: verify-full
        FirstInstance:
          Org:
            Human:
              UserName: ENC[AES256_GCM,data:EEBH0zf5WyATtw==,iv:I+IlJq9IPB3hh6DgmVrNykTfu6kNys+WehqjdmTDUzM=,tag:S93V8IZbhZBO9rlvWvXXGg==,type:str]
              FirstName: ENC[AES256_GCM,data:iprTNJGdDQ==,iv:jwY3LgMsovHvnPrXzo357t6pVVR1+YlOKTwh5uU3yDE=,tag:JL7rY3CLotvii31ajwuXPQ==,type:str]
              LastName: ENC[AES256_GCM,data:z7aM/izpsCVu,iv:bfy2NoUOOnIdWxd2pfnpBlgLaGG+XYtfJ9oEXaQF/uY=,tag:7JWja+20BLuBDMlxLUc8Rg==,type:str]
              Email: ENC[AES256_GCM,data:e0AW30SSPgM2NuYXYdfVNaFKkLcT,iv:s6AG2yS/ujVZyzBh3KKr51Q014ps+sgKPFcPjJC9YTI=,tag:KZe64GbXDZYVePH+0g6oAw==,type:str]
              Password: ENC[AES256_GCM,data:vp38GvueemHxX0b/Sh4cnAckg8Bt6J0h,iv:c2sMnepRfP+xK7IXj6bka9pjLL02eIQgOOS67m7rCb4=,tag:Y8QrlSzrRRv1j5Ir72tkfQ==,type:str]
              PasswordChangeRequired: ENC[AES256_GCM,data:ZliwEw==,iv:IVDAQGQQT+ZUz1/ynfO36UYuVCK7jj3iToqAYup3Zdw=,tag:hW+ykI9hzTsMHgdc54U1kQ==,type:bool]
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
      hosts:
        - host: auth.castor.baeriswyl.local
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: zitadel-tls
          hosts:
            - auth.castor.baeriswyl.local
    login:
      ingress:
        enabled: true
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: auth.castor.baeriswyl.local
            paths:
              - path: /ui/v2/login
                pathType: Prefix
        tls:
          - secretName: zitadel-tls
            hosts:
              - auth.castor.baeriswyl.local
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
