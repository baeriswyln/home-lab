              Password: ENC[AES256_GCM,data:awaM0ferwQAKvk3evAzrYK0349TOr45B,iv:NKP/HX7vVBcqvtGj6Zz131e+TBFijCkxPzAdCU27TZA=,tag:2QC0CVGpNjSBLzJRnXG3mg==,type:str]
              PasswordChangeRequired: ENC[AES256_GCM,data:v3PP2w==,iv:4rbuU/yGdPIiypEVMwGiypUIHfNRV5ypSyB7uAeVFBo=,tag:Y8Hhj85QKtA5KxSInj+ASQ==,type:bool]
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
      hosts:
        - host: auth.castor.baeriswyl.local
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: zitadel-tls
          hosts:
            - auth.castor.baeriswyl.local
    login:
      ingress:
        enabled: true
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: auth.castor.baeriswyl.local
            paths:
              - path: /ui/v2/login
                pathType: Prefix
        tls:
          - secretName: zitadel-tls
            hosts:
              - auth.castor.baeriswyl.local
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
