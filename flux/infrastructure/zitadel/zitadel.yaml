apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: zitadel
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: zitadel
      sourceRef:
        kind: HelmRepository
        name: zitadel
      interval: 5m
  releaseName: zitadel
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    replicaCount: 2
    zitadel:
      masterkeySecretName: zitadel-masterkey
      configSecretName: zitadel-db-credentials
      configmapConfig:
        ExternalDomain: auth.castor.baeriswyl.local
        ExternalSecure: true
        ExternalPort: 443
        TLS:
          Enabled: false
        Database:
          Postgres:
            Host: postgres.database.svc.cluster.local
            Port: 5432
            Database: zitadel
            User:
              Username: zitadel
              SSL:
                Mode: verify-full
            Admin:
              Username: postgres
              SSL:
                Mode: verify-full
        FirstInstance:
          Org:
            Human:
              UserName: ENC[AES256_GCM,data:hj88jvxaFzW5ow==,iv:6SrmQRe7ahnKnkozba8np0JrTqEgKdPxITsoAo5MCJU=,tag:LdacnyLo92CitlR3jXDRcA==,type:str]
              FirstName: ENC[AES256_GCM,data:8zqajGLDYA==,iv:1YU7rSq7Ocoofzm6wl8+p22VKntw8q8r2UWbs9F22cM=,tag:3OH80Wy1DDQ5Pi8uh9t1XQ==,type:str]
              LastName: ENC[AES256_GCM,data:F1RJqziVdcUW,iv:x7bH4E98tJK8j/ny6kkw1W7MEl6IRkdIXcNXTrklsb8=,tag:X16GtgS9oHhMmeLV8OS0Vw==,type:str]
