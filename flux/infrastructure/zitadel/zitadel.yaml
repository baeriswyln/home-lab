apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: zitadel
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: zitadel
      sourceRef:
        kind: HelmRepository
        name: zitadel
      interval: 5m
  releaseName: zitadel
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    replicaCount: 2
    zitadel:
      masterkeySecretName: zitadel-masterkey
      configSecretName: zitadel-db-credentials
      dbSslAdminCrtSecret: postgres-cert
      dbSslCaCrtSecret: postgres-cert
      dbSslUserCrtSecret: zitadel-cert
      configmapConfig:
        ExternalDomain: auth.castor.baeriswyl.dev
        ExternalSecure: true
        ExternalPort: 443
        TLS:
          Enabled: false
        Database:
          Postgres:
            Host: db-postgresql
            Port: 5432
            Database: zitadel
            User:
              Username: zitadel
              SSL:
                Mode: verify-full
            Admin:
              Username: postgres
              SSL:
                Mode: verify-full
        FirstInstance:
          Org:
            Human:
              UserName: ENC[AES256_GCM,data:dTUR/sbJUbbUZKk=,iv:RhvDZYq7RLTLGZHF6FdVQ2yXOm7SDIE4norT99xKN/I=,tag:R0FSAmfQWurcy/6PW0Qudw==,type:str]
              FirstName: ENC[AES256_GCM,data:bcIyag5fzg==,iv:6n6YM+MkD5MafyPH+dH2sdHG2ABgNuRYpOlV/L6+lzI=,tag:gTmNmc3U8p7cvYx4jitzDA==,type:str]
              LastName: ENC[AES256_GCM,data:1MDWpHOweJHP,iv:Oz/a07VoTm8Z0NlX0lgYH1u5kBqTaVRzXNIMCojRteY=,tag:517nDuYX6V7Z82PAd9fqow==,type:str]
              Email: ENC[AES256_GCM,data:5fkLf2jK1kUzpA3py/tTMh9NO1zr,iv:7+zmabm3QkVcYR9Hsot8Pcscfq6AgjG7ibvNyqKzNws=,tag:54gHpjNQvW2fF51AO0Ppiw==,type:str]
              Password: ENC[AES256_GCM,data:mPShcfqrPFateuCqFWiFKd+QO02nIPI6,iv:RwGLiIxn1SY41rzjXdDhPe2BbLqs+jFT3pkOUvDu6Z4=,tag:lyXJbyvuNcnOM7vtOguAPw==,type:str]
              PasswordChangeRequired: ENC[AES256_GCM,data:UF6Nm/c=,iv:c5M2ZX8jGdqyehAqnaHbnI1i4GpnleAiwgC88ijIK4A=,tag:hhyXQQL7E0xO2n6jKNBqig==,type:bool]
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: auth.castor.baeriswyl.dev
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: zitadel-tls
          hosts:
            - auth.castor.baeriswyl.dev
    login:
      ingress:
        enabled: true
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: auth.castor.baeriswyl.dev
            paths:
              - path: /ui/v2/login
                pathType: Prefix
        tls:
          - secretName: zitadel-tls
            hosts:
              - auth.castor.baeriswyl.dev
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
