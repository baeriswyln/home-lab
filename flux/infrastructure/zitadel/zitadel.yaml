apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: zitadel
  namespace: zitadel
spec:
  interval: 15m
  url: https://charts.zitadel.com/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: zitadel
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: zitadel
      sourceRef:
        kind: HelmRepository
        name: zitadel
      interval: 5m
  releaseName: zitadel
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    replicaCount: 2
    zitadel:
      masterkeySecretName: zitadel-masterkey
      configSecretName: zitadel-db-credentials
      dbSslAdminCrtSecret: postgres-cert
      dbSslCaCrtSecret: postgres-cert
      dbSslUserCrtSecret: zitadel-cert
      configmapConfig:
        ExternalDomain: auth.castor.baeriswyl.local
        ExternalSecure: true
        ExternalPort: 443
        TLS:
          Enabled: false
        Database:
          Postgres:
            Host: db-postgresql
            Port: 5432
            Database: zitadel
            User:
              Username: zitadel
              SSL:
                Mode: verify-full
            Admin:
              Username: postgres
              SSL:
                Mode: verify-full
        FirstInstance:
          Org:
            Human:
              UserName: nbaeriswyl
              FirstName: Nicolas
              LastName: Baeriswyl
              Email: nicolas@baeriswyl.dev
              Password: h7zyAzw%6C1E46AKsH27bqW@
              PasswordChangeRequired: true
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
      hosts:
        - host: auth.castor.baeriswyl.local
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: zitadel-tls
          hosts:
            - auth.castor.baeriswyl.local
    login:
      ingress:
        enabled: true
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: auth.castor.baeriswyl.local
            paths:
              - path: /ui/v2/login
                pathType: Prefix
        tls:
          - secretName: zitadel-tls
            hosts:
              - auth.castor.baeriswyl.local
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
