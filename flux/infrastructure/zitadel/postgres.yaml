apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bitnami
  namespace: zitadel
spec:
  type: oci
  url: oci://registry-1.docker.io/bitnamicharts
  interval: 1h0m0s
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: postgres
  namespace: zitadel
spec:
  interval: 10m0s
  chart:
    spec:
      chart: postgresql
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: zitadel
  values:
    auth:
      existingSecret: zitadel-db-credentials
      secretKeys:
        adminPasswordKey: Database.Postgres.Admin
        userPasswordKey: Database.Postgres.User
    persistence:
      enabled: true
      size: 10Gi
    tls:
      enabled: true
      certificatesSecret: postgres-cert
      certFilename: "tls.crt"
      certKeyFilename: "tls.key"
