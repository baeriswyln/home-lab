apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  baeriswyl.server: |
    baeriswyl.dev:53 {
        errors
        cache 30
        forward . 172.16.0.10 172.16.0.11 {
            policy sequential
            health_check 5s
        }
    }