apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-ingress
  namespace: longhorn-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`longhorn.castor.baeriswyl.dev`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: longhorn-frontend
          port: 80
          scheme: http
  tls:
    certResolver: letsencrypt
    domains:
    - main: "longhorn.castor.baeriswyl.dev"
