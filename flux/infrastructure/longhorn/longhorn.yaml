apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 15m
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: longhorn
      version: v1.10.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 5m
  releaseName: longhorn
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    defaultSettings:
      defaultDataPath: "/var/mnt/longhorn"
      defaultLonghornStaticStorageClass: longhorn
      storageOverProvisioningPercentage: 200
      storageMinimalAvailablePercentage: 10
      storageReservedPercentageForDefaultDisk: 10
      snapshotMaxCount: 10
    defaultBackupStore:
      backupTarget: s3://longhorn-bucket@garage/longhorn
      backupTargetCredentialSecret: garage-secret-longhorn-backup
---
# Daily backup to S3 — kept for 4 days
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  cron: "0 2 * * *"          # 02:00 UTC every day
  task: backup
  groups:
    - default
  retain: 4
  concurrency: 2
  labels:
    frequency: daily

---
# Hourly local snapshot — kept for 24 hours (fast recovery)
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: hourly-snapshot
  namespace: longhorn-system
spec:
  cron: "0 * * * *"          # top of every hour
  task: snapshot
  groups:
    - default
  retain: 24
  concurrency: 3
  labels:
    frequency: hourly

---
# Weekly backup — kept for 3 weeks (long-term retention)
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-backup
  namespace: longhorn-system
spec:
  cron: "0 3 * * 0"          # 03:00 UTC every Sunday
  task: backup
  groups:
    - default
  retain: 3
  concurrency: 1
  labels:
    frequency: weekly