#       kind: Rule
#       services:
#         - name: headlamp
#           port: 80
#           scheme: http
#   tls:
#     certResolver: letsencrypt-prod
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-ingress
  annotations:
    spec.ingressClassName: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: headlamp.castor.baeriswyl.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80
  tls:
    - secretName: headlamp-tls
      hosts:
        - headlamp.castor.baeriswyl.dev