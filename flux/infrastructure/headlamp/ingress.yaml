apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp-ingress
  namespace: headlamp
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`headlamp.castor.baeriswyl.dev`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: headlamp
          port: 80
          scheme: http
  tls:
    certResolver: letsencrypt
    domains:
    - main: "headlamp.castor.baeriswyl.dev"
