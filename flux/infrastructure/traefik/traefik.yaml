apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 5m
  releaseName: traefik
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    deployment:
      enabled: true
      kind: DaemonSet
    service:
      spec:
        externalTrafficPolicy: Local
    # redirect everything to https
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
    # Create an IngressRoute for the dashboard
    ingressRoute:
      dashboard:
        enabled: true
        # Custom match rule with host domain
        matchRule: Host(`traefik.castor.baeriswyl.dev`)
        entryPoints:
          - websecure
        # Add custom middlewares : authentication and redirection
        middlewares:
          - name: traefik-dashboard-auth
        tls:
          certResolver: letsencrypt
          domains: 
          - main: "traefik.castor.baeriswyl.dev"
    # Create the custom middlewares used by the IngressRoute dashboard (can also be created in another way).
    # /!\ Yes, you need to replace "changeme" password with a better one. /!\
    extraObjects:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: traefik-dashboard-auth-secret
        type: kubernetes.io/basic-auth
        stringData:
          username: ENC[AES256_GCM,data:Nq2l0dI=,iv:BYU51g3VGOanKSlPvc2w3Jz9aV9qEhS+yJIdvGjhcyQ=,tag:kOWzRHCmpABm/XLQHMYcCg==,type:str]
          password: ENC[AES256_GCM,data:HXhzUX4vovKS3t/t3ID6Ra7P5G8WCcmO,iv:5YYc10JqtmiHckIuXQLC6q3rnCoH67VPD7JGxyzJacM=,tag:mjSMbgpnvpsmo5CrUJDeuw==,type:str]
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: traefik-dashboard-auth
        spec:
          basicAuth:
            secret: traefik-dashboard-auth-secret
    certificatesResolvers:
      letsencrypt:
        acme:
          email: nicolas@baeriswyl.dev
          caserver: https://acme-v02.api.letsencrypt.org/directory
          storage: /data/acme.json
          dnschallenge:
            provider: cloudflare
            delaybeforecheck: 30
    env:
      - name: CF_API_EMAIL
        valueFrom:
          secretKeyRef:
            name: cf-api
            key: CF_API_EMAIL
      - name: CF_DNS_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cf-api
            key: CF_DNS_API_TOKEN
      - name: CF_ZONE_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cf-api
            key: CF_ZONE_API_TOKEN
    persistence:
      enabled: true
      path: /data
      size: 1Gi
