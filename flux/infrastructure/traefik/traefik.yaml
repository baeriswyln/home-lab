apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 5m
  releaseName: traefik
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    deployment:
      enabled: true
      kind: DaemonSet
    service:
      spec:
        externalTrafficPolicy: Local
    # redirect everything to https
    entrypoints:
      web:
        http:
          redirections:
            entrypoint:
              to: websecure
              scheme: https
    # Create an IngressRoute for the dashboard
    ingressRoute:
      dashboard:
        enabled: true
        # Custom match rule with host domain
        matchRule: Host(`traefik.castor.baeriswyl.local`)
        entryPoints:
          - websecure
        # Add custom middlewares : authentication and redirection
        middlewares:
          - name: traefik-dashboard-auth
    # Create the custom middlewares used by the IngressRoute dashboard (can also be created in another way).
    # /!\ Yes, you need to replace "changeme" password with a better one. /!\
    extraObjects:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: traefik-dashboard-auth-secret
        type: kubernetes.io/basic-auth
        stringData:
          username: ENC[AES256_GCM,data:McHQFio=,iv:zH0eX8lPXZRl6JKu29WSempdFhbp/r8SFIhTdGd9wnM=,tag:n8Heb1nGC37qvV8MXU/NOA==,type:str]
          password: ENC[AES256_GCM,data:Oj7ga11832CjYEnwDkwSlAA/5qM4gI7z,iv:tn8MVuGS4ns4BQWli5c3x2wXvKb7olKxbCh0QvoHq8o=,tag:U8aJ48lFEN+IjrVBeNaWsQ==,type:str]
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: traefik-dashboard-auth
        spec:
          basicAuth:
            secret: traefik-dashboard-auth-secret
