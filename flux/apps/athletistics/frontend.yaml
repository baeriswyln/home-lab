apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.portainer.kubernetes.application.name: frontend
    io.portainer.kubernetes.application.stack: frontend
  name: frontend
  namespace: athletistics
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: frontend
        io.portainer.kubernetes.application.name: frontend
    spec:
      containers:
        - image: athletistics/frontend:stable
          imagePullPolicy: Always
          name: frontend
          resources: {}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.portainer.kubernetes.application.name: frontend
    io.portainer.kubernetes.application.stack: frontend
  name: frontend
  namespace: athletistics
spec:
  ports:
    - name: port-0
      port: 80
      protocol: TCP
      targetPort: 80
  selector:
    app: frontend
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    spec.ingressClassName: traefik
  labels:
    io.portainer.kubernetes.application.kind: content
    io.portainer.kubernetes.application.stack: "frontend"
  name: frontend-tls-ingress
  namespace: athletistics
spec:
  ingressClassName: traefik
  rules:
  - host: app.athletistics.ch
    http:
      paths:
      - backend:
          service:
            name: frontend
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - app.athletistics.ch
    secretName: athletistics-tls