apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.portainer.kubernetes.application.name: core-api
    io.portainer.kubernetes.application.stack: backend
  name: core-api
  namespace: athletistics
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: core-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: core-api
        io.portainer.kubernetes.application.name: core-api
    spec:
      containers:
        - env:
            - name: ENV
              value: prod
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  key: DB_HOST
                  name: core-secret
            - name: METRICS_PWD
              valueFrom:
                secretKeyRef:
                  key: METRICS_PWD
                  name: core-secret
            - name: METRICS_USR
              valueFrom:
                secretKeyRef:
                  key: METRICS_USR
                  name: core-secret
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_DB
                  name: core-secret
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: core-secret
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_USER
                  name: core-secret
            - name: TOTP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  key: TOTP_ENDPOINT
                  name: core-secret
            - name: TOTP_SECONDS_LIMIT
              valueFrom:
                secretKeyRef:
                  key: TOTP_SECONDS_LIMIT
                  name: core-secret
            - name: ZITADEL_API_KEY
              valueFrom:
                secretKeyRef:
                  key: ZITADEL_API_KEY
                  name: core-secret
            - name: ZITADEL_INSTANCE
              valueFrom:
                secretKeyRef:
                  key: ZITADEL_INSTANCE
                  name: core-secret
            - name: ZITADEL_INSTANCE_GRPC
              valueFrom:
                secretKeyRef:
                  key: ZITADEL_INSTANCE_GRPC
                  name: core-secret
            - name: ZITADEL_KEY_PATH
              valueFrom:
                secretKeyRef:
                  key: ZITADEL_KEY_PATH
                  name: core-secret
            - name: ZITADEL_MGMT_API_KEY
              valueFrom:
                secretKeyRef:
                  key: ZITADEL_MGMT_API_KEY
                  name: core-secret
            - name: ZITADEL_MGMT_KEY_PATH
              valueFrom:
                secretKeyRef:
                  key: ZITADEL_MGMT_KEY_PATH
                  name: core-secret
          image: athletistics/core-api:stable
          imagePullPolicy: Always
          name: core-api
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.portainer.kubernetes.application.name: core-api
    io.portainer.kubernetes.application.stack: backend
  name: core-api
  namespace: athletistics
spec:
  ports:
    - name: port-0
      port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    app: core-api
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.portainer.kubernetes.application.name: core-db
    io.portainer.kubernetes.application.stack: backend
  name: core-db
  namespace: athletistics
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: core-db
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 100%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: core-db
        io.portainer.kubernetes.application.name: core-db
    spec:
      containers:
        - env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_DB
                  name: core-db-secret
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: core-db-secret
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_USER
                  name: core-db-secret
          image: postgres:16.2-alpine3.19
          imagePullPolicy: IfNotPresent
          name: core-db
          resources: {}
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: core-db-a0420144-fa48-416a-9b23-61774b8af86d
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: core-db-a0420144-fa48-416a-9b23-61774b8af86d
          persistentVolumeClaim:
            claimName: core-db-a0420144-fa48-416a-9b23-61774b8af86d
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.portainer.kubernetes.application.name: core-db
    io.portainer.kubernetes.application.stack: backend
  name: core-db
  namespace: athletistics
spec:
  ports:
    - name: port-0
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    app: core-db
  type: ClusterIP