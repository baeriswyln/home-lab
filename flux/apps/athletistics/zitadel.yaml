apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: zitadel
  namespace: athletistics
spec:
  interval: 15m
  url: https://charts.zitadel.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: athletistics
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: zitadel
      version: 8.11.2
      sourceRef:
        kind: HelmRepository
        name: zitadel
      interval: 5m
  releaseName: zitadel
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    zitadel:
      masterkeySecretName: zitadel-masterkey
      configSecretName: zitadel-db-credentials
      dbSslAdminCrtSecret: postgres-cert
      dbSslCaCrtSecret: postgres-cert
      dbSslUserCrtSecret: zitadel-cert
      configmapConfig:
        Database:
          Postgres:
            Admin:
              SSL:
                Mode: verify-full
              Username: postgres
            Database: zitadel
            Host: zitadel-db-postgresql
            MaxConnIdleTime: 5m
            MaxConnLifetime: 30m
            MaxIdleConns: 10
            MaxOpenConns: 20
            Port: 5432
            User:
              SSL:
                Mode: verify-full
              Username: zitadel
        ExternalDomain: login.athletistics.ch
        ExternalPort: 443
        ExternalSecure: true
        TLS:
          Enabled: false
      replicaCount: 2
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod
        spec.ingressClassName: traefik
      hosts:
        - host: login.athletistics.ch
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: login-athletistics-tls
          hosts:
            - login.athletistics.ch
    login:
      ingress:
        enabled: true
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: login.athletistics.ch
            paths:
              - path: /ui/v2/login
                pathType: Prefix
        tls:
          - secretName: login-athletistics-tls
            hosts:
              - login.athletistics.ch
