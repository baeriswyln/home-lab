---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical-operator
  namespace: infisical
spec:
  interval: 15m
  timeout: 10m
  chart:
    spec:
      chart: secrets-operator
      sourceRef:
        kind: HelmRepository
        name: infisical-helm-charts
      interval: 5m
  releaseName: secrets-operator
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    controllerManager:
      kubeRbacProxy:
        image:
          repository: gcr.io/kubebuilder/kube-rbac-proxy
          tag: v0.15.0
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
      manager:
        image:
          repository: infisical/kubernetes-operator
          tag: latest
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
      replicas: 1
    kubernetesClusterDomain: cluster.local
    metricsService:
      ports:
      - name: https
        port: 8443
        protocol: TCP
        targetPort: https
      type: ClusterIP