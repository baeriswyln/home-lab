apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wp--orgel-plaffeien
  namespace: apps
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: wordpress
      sourceRef:
        kind: HelmRepository
        name: bitnami-charts
      interval: 20m
  releaseName: wp--orgel-plaffeien
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    image:
      pullPolicy: Always
    # add a container that links wp-load.php for the twint plugin
    initContainers:
      - name: fix-wp-load-path
        image: busybox
        command:
          - sh
          - -c
          - |
            mkdir -p /var/www/html
            ln -sfn /opt/bitnami/wordpress/wp-load.php /var/www/html/wp-load.php
    wordpressConfigureCache: false
    memcached:
      enabled: true
    mariadb:
      auth:
        database: ENC[AES256_GCM,data:tNqqF6WC+dH/DwOj5EaM/Ec=,iv:cxvMvkMNY5STKfpPNizEGRItNstvbF9J6FFNUSPigMM=,tag:cOxmbamnym35JIKj86JK9A==,type:str]
        password: ENC[AES256_GCM,data:ZXtF2oOhbdUooK7SJ7cYFFGhazc=,iv:JgP4PrnHh1ySwHt/dBSJAU3pEipcqDGbyZUiRdJ9MME=,tag:ARHGh9w0NV+kCsTLqClZRg==,type:str]
        rootPassword: ENC[AES256_GCM,data:gdsjOLXWL8MEJK2ntwS8L0iRjHE=,iv:daWa8qBlP9zRHGzBfu4E8RjC+uI4ihHrdEBiY9IN2f0=,tag:3Z8tsH4RS90YEW1WR2H0CQ==,type:str]
        username: ENC[AES256_GCM,data:TXDfuvzgSNB5F2LDSzlWrzMf26k7rA==,iv:0rjNoCZb/oydGxVx1NkiDS7Vl/a1gFXOXgz8JHnvih0=,tag:YfkViku3jQJ3xlwG92SCog==,type:str]
      primary:
        persistence:
          size: 1Gi
        resourcesPreset: none
    persistence:
      size: 4Gi
    extraVolumes:
      - name: php-opcache-config
        configMap:
          name: php-opcache-config
    extraVolumeMounts:
      - name: php-opcache-config
        mountPath: /opt/bitnami/php/etc/conf.d/opcache.ini
        subPath: opcache.ini
        readOnly: true
    resourcesPreset: none
    wordpressPassword: ENC[AES256_GCM,data:b3G0ySF7h6W/IPbt1p9ciwmJww8=,iv:NS68G3K3ICvKs8NY7fKrMhvud1exE2Cpj0/h6RMl2no=,tag:j0rZt10FaPB/JkU8I1351g==,type:str]
    wordpressScheme: https
    wordpressUsername: ENC[AES256_GCM,data:2d8dJmnW1drxcyCpzx8=,iv:k0I3DpRONQxwx3jFFl73iZ4WgvM7ujaA5YWGu/bmZlc=,tag:sX1gTApgBr0hdUUgvsjLGg==,type:str]
    updateStrategy:
      type: Recreate
    podSecurityContext:
      enabled: true
      fsGroup: 1001
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsNonRoot: true
    # TLS 1.3 fix
    fips:
      openssl: "off"
