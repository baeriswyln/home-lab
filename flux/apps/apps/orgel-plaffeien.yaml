apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wp--orgel-plaffeien
  namespace: apps
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: wordpress
      sourceRef:
        kind: HelmRepository
        name: bitnami-charts
      interval: 20m
  releaseName: wp--orgel-plaffeien
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    image:
      pullPolicy: Always
    # add a container that links wp-load.php for the twint plugin
    initContainers:
      - name: fix-wp-load-path
        image: busybox
        command:
          - sh
          - -c
          - |
            mkdir -p /var/www/html
            ln -sfn /opt/bitnami/wordpress/wp-load.php /var/www/html/wp-load.php
    wordpressConfigureCache: false
    memcached:
      enabled: true
    mariadb:
      auth:
        database: ENC[AES256_GCM,data:5BrfXl36RzuLZVg57gE0aDU=,iv:JdBQ9bnznrHE60pnHGfofA88aj43KQQEPgMJrtOo8Rs=,tag:S+81fPy1R1uIpnTtIYJXFw==,type:str]
        password: ENC[AES256_GCM,data:PkojPbnwYg2MhtOOEmQcEM8KSd4=,iv:9pMOEIcQ0qd1sgUnRGiNJrmc0Jdd0BaVuML5T3ybEnI=,tag:PKGUevHYFuDL62YoXyyfBw==,type:str]
        rootPassword: ENC[AES256_GCM,data:0ph+3ylUL48rOWpCSpFkIUXDpYo=,iv:kKNc3vCX6hIv80hpxAqI/OY5QQbhD40VJcYMAUJl2ao=,tag:tz5N1ibvSXAiUCQGEXjSXg==,type:str]
        username: ENC[AES256_GCM,data:6Fl1WNQRlogv+wNVziVvr7wH+2UzsA==,iv:rY2ysOyhbVXqCUqy6ZJSMTF3l2t13JiWngIjLch2JV4=,tag:5JYtMJz/Kb4TGfJIZnJr0Q==,type:str]
      primary:
        persistence:
          size: 1Gi
        resourcesPreset: none
    persistence:
      size: 4Gi
    extraVolumes:
      - name: php-opcache-config
        configMap:
          name: php-opcache-config
    extraVolumeMounts:
      - name: php-opcache-config
        mountPath: /opt/bitnami/php/etc/conf.d/opcache.ini
        subPath: opcache.ini
        readOnly: true
    resourcesPreset: none
    wordpressPassword: ENC[AES256_GCM,data:+Y96cFEUQ0CFxS60owTN0rgRUZk=,iv:Jxy/8KvHRrcC4T14C8N9WH5XY9Iqg0sa71gnW+81XAU=,tag:zznbfdE64zL9TiGYYz1mvA==,type:str]
