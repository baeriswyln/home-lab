apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wp--orgel-plaffeien
  namespace: apps
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: wordpress
      sourceRef:
        kind: HelmRepository
        name: bitnami-charts
      interval: 20m
  releaseName: wp--orgel-plaffeien
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    image:
      pullPolicy: Always
    # add a container that links wp-load.php for the twint plugin
    initContainers:
      - name: fix-wp-load-path
        image: busybox
        command:
          - sh
          - -c
          - |
            mkdir -p /var/www/html
            ln -sfn /opt/bitnami/wordpress/wp-load.php /var/www/html/wp-load.php
    wordpressConfigureCache: false
    memcached:
      enabled: true
    mariadb:
      auth:
        database: ENC[AES256_GCM,data:xOr0BTw9c4HRAG3BmGyU5Ow=,iv:m8XMIkDlHIHeh1oVHrk2Fx+gCTtaLtYvYHE47+V34jE=,tag:NdohoJKhqnRHVIyYq3kIXg==,type:str]
        password: ENC[AES256_GCM,data:f0avde7OY8hKodkV5LsaSqCXZmg=,iv:45Due8YzGpoqt27fgKM5v3r2BSXNFgjljYiJRRuLFWU=,tag:4s3G4k/b9+cxFtRzkyXFZw==,type:str]
        rootPassword: ENC[AES256_GCM,data:xwG0DlZ36nzL6nTbB2FXLrVRFwo=,iv:Qosh0U3+Zl22QbZBNBPRKnk9eP+iC7LGreeNdmonPn4=,tag:yNMMZl5xHQpZCBCpPJuISg==,type:str]
        username: ENC[AES256_GCM,data:c3RuwWK10uhXXeTc/6ndUmdU6IdGAw==,iv:h735KJfe5OhDrYC/8n1Zv5KggAtRCpJDRmqJoZ4TzAs=,tag:SQKFsgAjnSwxH9oTraxn3g==,type:str]
      primary:
        persistence:
          size: 1Gi
        resourcesPreset: none
    persistence:
      size: 3Gi
    extraVolumes:
      - name: php-opcache-config
        configMap:
          name: php-opcache-config
    extraVolumeMounts:
      - name: php-opcache-config
        mountPath: /opt/bitnami/php/etc/conf.d/opcache.ini
        subPath: opcache.ini
        readOnly: true
    resourcesPreset: none
    wordpressPassword: ENC[AES256_GCM,data:TyVQ/H7MR1pC2HMoGBTClWMAtis=,iv:Ldh0j0bII+miPdrBvFINfPlLQndJIpaQk/AvPUuNKT0=,tag:QUWO/S4lpInOTD50kukMzg==,type:str]
