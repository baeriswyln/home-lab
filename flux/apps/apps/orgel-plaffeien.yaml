apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wp--orgel-plaffeien
  namespace: apps
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: wordpress
      sourceRef:
        kind: HelmRepository
        name: bitnami-charts
      interval: 20m
  releaseName: wp--orgel-plaffeien
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    image:
      pullPolicy: Always
    # add a container that links wp-load.php for the twint plugin
    initContainers:
      - name: fix-wp-load-path
        image: busybox
        command:
          - sh
          - -c
          - |
            mkdir -p /var/www/html
            ln -sfn /opt/bitnami/wordpress/wp-load.php /var/www/html/wp-load.php
    wordpressConfigureCache: false
    memcached:
      enabled: true
    mariadb:
      auth:
        database: ENC[AES256_GCM,data:BgPJPjExpjMZZdmy7zh0Mzg=,iv:qu2FTGlD0xpgNWpxWAg+MoBHT8lmI0Q+i0gk/3UszA0=,tag:CQCUhfo+ZliqraURUwT/LA==,type:str]
        password: ENC[AES256_GCM,data:9TiQpI+NVG5Vmwa70sKyE5oNX28=,iv:1LrzLAHp1ETS+v5uekqexw0vXVSvbLKSDjpGE95dp5E=,tag:SI0Ov2eXUBea9rpUMnBQBg==,type:str]
        rootPassword: ENC[AES256_GCM,data:cAK8CHYmXvtHjzn2vxbzIIBtl/M=,iv:Be++ykbed2e5f2R6f78e4RBA1DZ+76HWpEbOkWNmHrU=,tag:+ySZKRu/V2Updric1aK+oA==,type:str]
        username: ENC[AES256_GCM,data:tyz4sXZZ7oOcBJnIfemmiwe1rgBlzg==,iv:BCPJgxTrOCrj8s6xfzRwYOR/8P2n8+MUQrrxYiONupU=,tag:59amnTGUfLJg8Fog3I+qkg==,type:str]
      primary:
        persistence:
          size: 2Gi
        resourcesPreset: none
    persistence:
      size: 4Gi
    extraVolumes:
      - name: php-opcache-config
        configMap:
          name: php-opcache-config
    extraVolumeMounts:
      - name: php-opcache-config
        mountPath: /opt/bitnami/php/etc/conf.d/opcache.ini
