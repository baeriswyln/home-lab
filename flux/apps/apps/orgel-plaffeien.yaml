apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    spec.ingressClassName: traefik
  name: wp--orgel-plaffeien-tls-ingress
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: orgel-plaffeien.ch
      http:
        paths:
          - backend:
              service:
                name: wp--orgel-plaffeien-wordpress
                port:
                  number: 80
            path: /
            pathType: Prefix
    - host: www.orgel-plaffeien.ch
      http:
        paths:
          - backend:
              service:
                name: wp--orgel-plaffeien-wordpress
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - orgel-plaffeien.ch
        - www.orgel-plaffeien.ch
      secretName: wp--orgel-plaffeien-tls
