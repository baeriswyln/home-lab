# php config 
apiVersion: v1
kind: ConfigMap
metadata:
  name: php-opcache-config
  namespace: apps
data:
  opcache.ini: |
    [opcache]
    opcache.enable_cli=1
    opcache.interned_strings_buffer = 32
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wp--orgel-plaffeien
  namespace: apps
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: wordpress
      sourceRef:
        kind: HelmRepository
        name: bitnami-charts
      interval: 20m
  releaseName: wp--orgel-plaffeien
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    image:
      pullPolicy: Always
    # add a container that links wp-load.php for the twint plugin
    initContainers:
      - name: fix-wp-load-path
        image: busybox
        command:
          - sh
          - -c
          - |
            mkdir -p /var/www/html
            ln -sfn /opt/bitnami/wordpress/wp-load.php /var/www/html/wp-load.php
    wordpressConfigureCache: false
    memcached:
      enabled: true
    mariadb:
      auth:
        database: ENC[AES256_GCM,data:d6r3YdieMqv0Qnw+H/1/XeY=,iv:YMdmktsaWsYxJnf9JQ6oShLfLRFm+cLqRi7AvaVy8HI=,tag:efW0PzR2Ef3fEDsyGxkFBw==,type:str]
        password: ENC[AES256_GCM,data:6bgmSC1gR05uxlRGoRXycdMYqkE=,iv:f4OqeAncHraXGmrl77rCaOoL+GPrY9KTblJoFMtQco8=,tag:uLzu59wddQzs8OYq8OwSCQ==,type:str]
        rootPassword: ENC[AES256_GCM,data:Uqlg2xl4g9aZNyIgI9sLv3jfpV8=,iv:PBR2+uuk6c4kpTlYqo2auBoIYcqh7zcczG0tIH0MjKk=,tag:EvXpOzMZ0wQRDLcNjV+7jg==,type:str]
        username: ENC[AES256_GCM,data:YZg1Q5DioRyJxcLb3ghF1VIfjuHt5g==,iv:H7J7SYWICr+nkl5DhI6CvgtUhJFPG8aF5Ok6cPx9ly0=,tag:Xjp2uQZZWmgLbCBVqydwCw==,type:str]
      primary:
