apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wp--orgel-plaffeien
  namespace: apps
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: wordpress
      sourceRef:
        kind: HelmRepository
        name: bitnami-charts
      interval: 20m
  releaseName: wp--orgel-plaffeien
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    image:
      pullPolicy: Always
    # add a container that links wp-load.php for the twint plugin
    initContainers:
      - name: fix-wp-load-path
        image: busybox
        command:
          - sh
          - -c
          - |
            mkdir -p /var/www/html
            ln -sfn /opt/bitnami/wordpress/wp-load.php /var/www/html/wp-load.php
    wordpressConfigureCache: false
    memcached:
      enabled: true
    mariadb:
      auth:
        database: ENC[AES256_GCM,data:n1sZoKcQ4dpl0X3UmTrENPE=,iv:D/eH0z/M6gFfiAQGlJT9rTc+5Iinwmyww2q3JY5skbM=,tag:7rmzrbYFjNDExihf3X8lBQ==,type:str]
        password: ENC[AES256_GCM,data:DChfqEm3/rjFO/OocljjQayp0Pc=,iv:ED9VTT2Fbzi5uPmb9GWFEACI8patLtFmb0s8uQE7pRs=,tag:TTPROxpb1iRrpdWywLwUVA==,type:str]
        rootPassword: ENC[AES256_GCM,data:MmW9TwmWIf9uzAjNyBDWOPPyMq0=,iv:Rq56eSMH5msHAbNzVaWL3ZOzgkHBt5gxQtyu1tTHBTc=,tag:mzQ5PK5Kf8SVMw0+eO/KgA==,type:str]
        username: ENC[AES256_GCM,data:69agRYVYSdWoeNL1vSKZktfqe5VnLg==,iv:Itd4dTHDIrn8X5/+PlGBySeAazLuX7a90+1/suTDu0I=,tag:hrEaVc0ZKQPtBx06RdyTUg==,type:str]
      primary:
        persistence:
          size: 1Gi
        resourcesPreset: none
    persistence:
      size: 3Gi
    extraVolumes:
      - name: php-opcache-config
        configMap:
          name: php-opcache-config
    extraVolumeMounts:
      - name: php-opcache-config
        mountPath: /opt/bitnami/php/etc/conf.d/opcache.ini
