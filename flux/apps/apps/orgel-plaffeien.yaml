apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wp--orgel-plaffeien
  namespace: apps
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: wordpress
      sourceRef:
        kind: HelmRepository
        name: bitnami-charts
      interval: 20m
  releaseName: wp--orgel-plaffeien
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    image:
      pullPolicy: Always
    # add a container that links wp-load.php for the twint plugin
    initContainers:
      - name: fix-wp-load-path
        image: busybox
        command:
          - sh
          - -c
          - |
            mkdir -p /var/www/html
            ln -sfn /opt/bitnami/wordpress/wp-load.php /var/www/html/wp-load.php
    wordpressConfigureCache: false
    memcached:
      enabled: true
    mariadb:
      auth:
        database: ENC[AES256_GCM,data:i8dLnzz5u3kcL5/YS4VSS4E=,iv:US7xDokH3LAlxBf64iZB/xmelfwTyVSYxsx4Gps5N8E=,tag:PM1uXILzbLxFxfd3Oe+gaQ==,type:str]
        password: ENC[AES256_GCM,data:3fEIgB/TU1z+BLkjRLR4oHzaSbs=,iv:FEpXrB/bJkDrFu7oZMUu8DCH4fGDYa0slydcSy7+FDs=,tag:yLotFPO3WI14GTEEVtLRUQ==,type:str]
        rootPassword: ENC[AES256_GCM,data:CpmUVR9V9CiQ55MwVjwGQHCaLeg=,iv:+3HBMxkNIraz96UorLqgEAdTW8XzesMDsDgT5oevoJE=,tag:wJYfzSMtxkhwI1tE/YzHAQ==,type:str]
        username: ENC[AES256_GCM,data:ARf195bUSyK9dRe+byxGc89W+hdrPA==,iv:5R2nDdcWhQ4iG3QauT5j3rV6cIxB3VindzJVSaUVKHI=,tag:Bxir+QPSYVyIbEteNlRY3g==,type:str]
      primary:
        persistence:
          size: 500Mi
        resourcesPreset: none
    persistence:
      size: 4Gi
    extraVolumes:
      - name: php-opcache-config
        configMap:
          name: php-opcache-config
    extraVolumeMounts:
      - name: php-opcache-config
        mountPath: /opt/bitnami/php/etc/conf.d/opcache.ini
        subPath: opcache.ini
        readOnly: true
    resourcesPreset: none
    wordpressPassword: ENC[AES256_GCM,data:121u5C9DEb5y5M+6tS7rB7f7JI0=,iv:l56R5POmXsq27BKyXMxC5yQUrkRvbxDN8CZSdsqCPVg=,tag:diUxHZen8uAAP4k0IDtZ0g==,type:str]
