        readOnly: true
    resourcesPreset: none
    wordpressPassword: ENC[AES256_GCM,data:acFmkuJym6Re4xioiwti+7U159I=,iv:x1S2Qb3iQ/rhJdRhYiZnBhgimsp1Q5L5E46yrefB4Rw=,tag:O+uqFPt2WblhQdUWJzBdgw==,type:str]
