apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wp--orgel-plaffeien
  namespace: apps
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: wordpress
      sourceRef:
        kind: HelmRepository
        name: bitnami-charts
      interval: 20m
  releaseName: wp--orgel-plaffeien
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    image:
      pullPolicy: Always
    # add a container that links wp-load.php for the twint plugin
    initContainers:
      - name: fix-wp-load-path
        image: busybox
        command:
          - sh
          - -c
          - |
            mkdir -p /var/www/html
            ln -sfn /opt/bitnami/wordpress/wp-load.php /var/www/html/wp-load.php
    wordpressConfigureCache: false
    memcached:
      enabled: true
    mariadb:
      auth:
        database: ENC[AES256_GCM,data:oXg5x37/oeMfzB2JsJp/Buc=,iv:16+awiSuxqQ9kyAzD2czBci/VTg/X5RXeRdDHZ0BSyE=,tag:3NSWphF3PNk6DQnUFJ3oug==,type:str]
        password: ENC[AES256_GCM,data:xIgvleBcr2Ako+PDyJU4bvbOJqY=,iv:bSQ+pcpv1wi9aEUVK70P7yWo+Z8pAraAfBJKfUsTpzs=,tag:wyk1l4aY2VMaScTLooyFGg==,type:str]
        rootPassword: ENC[AES256_GCM,data:g3UHVoYsLhCWDhsHStgyLxoTYUU=,iv:/tt1RQ89/Cp4kS142oJ6V/myStGwKzY1/31LHeLiVhg=,tag:hQ+FeXzgkkZpOJr6a14rlg==,type:str]
        username: ENC[AES256_GCM,data:8ZKLmc1ya248tXLjOR4aQ+yo8PZOTg==,iv:M728RmLoP/SXH3fItCUVSa6e9x2AQbysVaesLs6nBnU=,tag:/yh3KgrXwc8e6wGNUKYQdQ==,type:str]
      primary:
        persistence:
          size: 500Mi
        resourcesPreset: none
    persistence:
      size: 4Gi
    extraVolumes:
      - name: php-opcache-config
        configMap:
          name: php-opcache-config
    extraVolumeMounts:
      - name: php-opcache-config
        mountPath: /opt/bitnami/php/etc/conf.d/opcache.ini
