apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.portainer.kubernetes.application.name: playwright-renderer
    io.portainer.kubernetes.application.stack: frieat
  name: playwright-renderer
  namespace: apps
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: playwright-renderer
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 100%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: playwright-renderer
        io.portainer.kubernetes.application.name: playwright-renderer
    spec:
      containers:
        - image: docker.io/baeriswyln/playwright-renderer:latest
          imagePullPolicy: Always
          name: playwright-renderer
          resources:
            limits:
              cpu: "1"
              memory: 2304M
            requests:
              cpu: "1"
              memory: 2304M
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: registry-1
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.portainer.kubernetes.application.name: playwright-renderer
    io.portainer.kubernetes.application.stack: frieat
  name: playwright-renderer
  namespace: apps
spec:
  ports:
    - name: port-0
      port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    app: playwright-renderer
  sessionAffinity: None
  type: ClusterIP
