apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: limesurvey
  namespace: apps
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: limesurvey
      sourceRef:
        kind: HelmRepository
        name: martialblog
      interval: 5m
  releaseName: limesurvey
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
  values:
    ingress:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        spec.ingressClassName: traefik
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.middlewares: apps-limesurvey-headers@kubernetescrd
      className: traefik
      enabled: true
      hosts:
        - host: limesurvey.baeriswyl.dev
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - hosts:
            - limesurvey.baeriswyl.dev
          secretName: limesurvey-tls
    limesurvey:
      publicUrl: https://limesurvey.baeriswyl.dev
      baseUrl: https://limesurvey.baeriswyl.dev
      admin:
        email: nicolas.baeriswyl@rega-sense.ch
        name: Nicolas
        user: adm-nicolas
    mariadb:
      auth:
        database: ENC[AES256_GCM,data:K+Kzgib9tOao7A==,iv:ORpB3LS2FnqOJ3F94PiWicDiwENbg1yDLMKhtV+netc=,tag:MSKf0l2e7iTw8s9m3elt4A==,type:str]
        password: ENC[AES256_GCM,data:fD15WySElaeS+Oxlut6d3FtQkBs=,iv:K6tw7SF84m5CrWHNNtHH5TU4vojK3TkUUuBEvcSJ0sk=,tag:3avncHlj23CxnwNUqZOSZw==,type:str]
        rootPassword: ENC[AES256_GCM,data:GpXIjwJRAcaZKLzFat4Yy3UVuHk=,iv:WpiVm2JVUUaH6MOwMxvJXAafWjbyB+G9L2tq0Sz0siI=,tag:VVfcVZeMwqAQRkV7KX3Png==,type:str]
        username: ENC[AES256_GCM,data:kYKo5SjhJ9wKYw==,iv:qZV83Ffiy2vonzpj6mCdrc7rFptfH+1Xrhco/uyY4Nc=,tag:ceeBCIbxKbOxyXz7abzmvQ==,type:str]
      enabled: true
      image:
        tag: latest
    updateStrategy:
      type: Recreate
    extraVolumes:
      - name: apache-servername
    extraVolumeMounts:
      - name: apache-servername
        mountPath: /etc/apache2/conf-enabled/servername.conf
        subPath: servername.conf
        configMap: apache-servername-config
      - name: kcfinder
        mountPath: /var/www/html/vendor/kcfinder/conf/config.php
        subPath: config.php
        configMap: kcfinder-config
      - name: kcfinder-browser
        mountPath: /var/www/html/vendor/kcfinder/tpl/tpl_browser.php
        subPath: tpl_browser.php
        configMap: kcfinder-browser-config
